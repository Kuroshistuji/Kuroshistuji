<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="8"/>

  <!-- Border -->
  <rect width="800" height="450" fill="none" stroke="#30363d" stroke-width="1" rx="8"/>

  <!-- Terminal-style top bar -->
  <rect x="0" y="0" width="800" height="36" fill="#161b22" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#161b22"/>

  <!-- Traffic light dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" fill-opacity="0.7"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e" fill-opacity="0.7"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f" fill-opacity="0.7"/>

  <!-- Tab title -->
  <text x="400" y="22" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">network-infrastructure-config</text>

  <!-- Divider -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Screenshot placeholder icon -->
  <rect x="340" y="160" width="120" height="90" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="340" y1="250" x2="380" y2="210" stroke="#30363d" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="415" y2="235" stroke="#30363d" stroke-width="1.5"/>
  <line x1="415" y1="235" x2="440" y2="205" stroke="#30363d" stroke-width="1.5"/>
  <line x1="440" y1="205" x2="460" y2="250" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="370" cy="185" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Label -->
  <text x="400" y="295" font-family="'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">Screenshot pending</text>
  <text x="400" y="316" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#6e7681" text-anchor="middle">Replace with: network diagram, firewall rules, or runbook page</text>
  <text x="400" y="334" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" fill="#6e7681" text-anchor="middle">Suggested: assets/screenshots/network-infrastructure-config.png</text>
</svg>
