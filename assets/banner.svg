<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Dark base gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <!-- Accent glow gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter — used on the main title text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="textBlur"/>
      <feMerge>
        <feMergeNode in="textBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow filter — used on decorative dots and status indicator -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="dotBlur"/>
      <feMerge>
        <feMergeNode in="dotBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines (horizontal) -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- Subtle grid lines (vertical) -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="400" y1="0" x2="400" y2="300" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="300" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="800" y1="0" x2="800" y2="300" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="1000" y1="0" x2="1000" y2="300" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="150" rx="180" ry="100" fill="#00d4ff" fill-opacity="0.04"/>
  <ellipse cx="1000" cy="150" rx="180" ry="100" fill="#7c3aed" fill-opacity="0.05"/>

  <!-- Decorative circuit-like nodes (left side) -->
  <circle cx="80" cy="100" r="3" fill="#00d4ff" fill-opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="80" cy="200" r="3" fill="#00d4ff" fill-opacity="0.6" filter="url(#softGlow)"/>
  <line x1="80" y1="100" x2="80" y2="200" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="80" y1="150" x2="140" y2="150" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="140" cy="150" r="2.5" fill="#00d4ff" fill-opacity="0.5"/>

  <!-- Decorative circuit-like nodes (right side) -->
  <circle cx="1120" cy="100" r="3" fill="#a78bfa" fill-opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="1120" cy="200" r="3" fill="#a78bfa" fill-opacity="0.6" filter="url(#softGlow)"/>
  <line x1="1120" y1="100" x2="1120" y2="200" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="1060" y1="150" x2="1120" y2="150" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="1060" cy="150" r="2.5" fill="#a78bfa" fill-opacity="0.5"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentLine)" rx="1"/>
  <!-- Bottom accent line -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accentLine)" rx="1"/>

  <!-- Main title -->
  <text x="600" y="120" font-family="'Segoe UI', 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="2">Kuroshitsuji</text>

  <!-- Thin separator line under title -->
  <line x1="440" y1="138" x2="760" y2="138" stroke="url(#accentLine)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Subtitle / role tags -->
  <text x="600" y="175" font-family="'Segoe UI', 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#8b949e" letter-spacing="4">INFRASTRUCTURE  ·  NETWORKING  ·  AUTOMATION  ·  FULL STACK</text>

  <!-- Status indicator dot -->
  <circle cx="498" cy="220" r="5" fill="#00d4ff" fill-opacity="0.9" filter="url(#softGlow)"/>
  <!-- Pulsing ring animation -->
  <circle cx="498" cy="220" r="5" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r" values="5;12;5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Status label -->
  <text x="512" y="225" font-family="'Segoe UI', 'SF Pro Text', 'Inter', sans-serif" font-size="13" font-weight="500" fill="#8b949e" letter-spacing="1">Available for opportunities</text>
</svg>
