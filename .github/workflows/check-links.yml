name: Check Links

# Runs on push and pull request when a Markdown file changes.
# Also runs on a weekly schedule to catch links that go dead over time
# without any file change triggering a run.
on:
  push:
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a newer push arrives.
# Scheduled runs are not cancelled — they always run to completion.
concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only — this workflow never writes back to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # lychee is a fast, async link checker written in Rust.
      # It natively understands Markdown and extracts all URLs automatically.
      #
      # Key options used here:
      #   --no-progress      clean output in CI logs
      #   --include-fragments also checks anchor targets (#section-name)
      #   --retry-wait-time  back off before retrying rate-limited responses
      #   --max-retries      retry transient failures before reporting broken
      #   --timeout          per-request timeout in seconds
      #
      # Excluded patterns (--exclude):
      #   github-readme-stats.vercel.app — known to return 503 intermittently;
      #     the asset is a dynamic image, not a page that can be validated here.
      #   streak-stats.demolab.com — same reason; image CDN, not a stable URL.
      #   readme-typing-svg.demolab.com — same reason.
      #   raw.githubusercontent.com/Kuroshitsuji/Kuroshitsuji/output — the
      #     output branch is generated by the snake workflow after first push;
      #     the files do not exist until that workflow runs.
      #   linkedin.com — LinkedIn blocks automated HEAD requests with 999.
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --retry-wait-time 10
            --max-retries 3
            --timeout 30
            --exclude "github-readme-stats\.vercel\.app"
            --exclude "streak-stats\.demolab\.com"
            --exclude "readme-typing-svg\.demolab\.com"
            --exclude "raw\.githubusercontent\.com/Kuroshitsuji/Kuroshitsuji/output"
            --exclude "linkedin\.com"
            **/*.md
          fail: true
