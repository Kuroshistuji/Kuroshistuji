name: Lint Markdown

# Runs on every push and pull request that touches a Markdown file.
# Also available via manual dispatch for on-demand checks.
on:
  push:
    paths:
      - "**.md"
      - ".markdownlint.yaml"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.yaml"
  workflow_dispatch:

# Only one lint run per branch at a time. A newer push cancels the in-progress
# run for the same branch, saving minutes on rapid successive commits.
concurrency:
  group: lint-markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Read-only access is sufficient — this workflow never writes to the repo.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # markdownlint-cli2 is the modern CLI for the markdownlint library.
      # It reads .markdownlint.yaml automatically from the repository root.
      # The glob pattern "**/*.md" matches README.md and CONTRIBUTING.md.
      # "#node_modules" excludes any future vendored dependencies.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #node_modules
