version: 2

updates:
  # Keep GitHub Actions pinned to their latest patch versions automatically.
  # Dependabot opens a pull request for each outdated action, which keeps
  # the workflow files current without requiring manual version tracking.
  #
  # Actions maintained in this repository:
  #   actions/checkout
  #   DavidAnson/markdownlint-cli2-action
  #   Platane/snk
  #   peaceiris/actions-gh-pages
  #   lycheeverse/lychee-action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Check for updates every Monday — aligns with the link-check
      # scheduled run so both land on the same day of the week.
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    # Group all action updates into a single pull request per week rather
    # than one PR per action. Reduces noise in the pull request list.
    groups:
      github-actions:
        patterns:
          - "*"
    # Labels applied to Dependabot pull requests for easy filtering.
    labels:
      - dependencies
      - github-actions
    # Limit open Dependabot PRs to avoid clutter.
    open-pull-requests-limit: 5
