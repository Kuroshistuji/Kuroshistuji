name: Bug Report
description: Report a defect or unexpected behaviour
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the form below with as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear summary of the bug. What happened, and what did you expect to happen?
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, reproducible example or list the exact steps.
      placeholder: |
        1. Clone the repository
        2. Run `npm install`
        3. Execute `npm start`
        4. Observe the error in the terminal
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages, screenshots, or logs.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version or commit are you using?
      placeholder: "v1.2.3 or commit SHA"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, relevant dependencies
      placeholder: |
        - OS: Ubuntu 22.04
        - Node.js: 20.11.0
        - Docker: 24.0.7
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant — related issues, workarounds attempted, screenshots.
    validations:
      required: false
